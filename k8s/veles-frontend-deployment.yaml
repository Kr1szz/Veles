apiVersion: apps/v1
kind: Deployment
metadata:
  name: veles-frontend
  namespace: veles-shield
  labels:
    app: veles-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: veles-frontend
  template:
    metadata:
      labels:
        app: veles-frontend
    spec:
      containers:
        - name: veles-frontend
          image: veles-shield/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: veles-frontend
  namespace: veles-shield
spec:
  selector:
    app: veles-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
