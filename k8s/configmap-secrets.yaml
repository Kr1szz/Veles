apiVersion: v1
kind: ConfigMap
metadata:
  name: veles-config
  namespace: veles-shield
data:
  ENVIRONMENT: "production"
  AUTH_ENABLED: "true"
  DEBUG: "false"
  APP_NAME: "Veles Shield"
  APP_VERSION: "1.0.0"
  SLA_MAX_LATENCY_MS: "50.0"
  RATE_LIMIT_GLOBAL_PER_MIN: "120"
  VELOCITY_KYC_LIMIT_PER_MIN: "5"
  VELOCITY_TX_LIMIT_PER_MIN: "10"
  REDIS_ENABLED: "true"
  REDIS_URL: "redis://veles-redis.veles-shield.svc.cluster.local:6379/0"
# Create `veles-secrets` through your cluster's secret manager before deploy.
# Required keys: SECRET_KEY, VELES_ENCRYPTION_KEY, AEGIS_ENCRYPTION_KEY,
# DATABASE_URL, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
