apiVersion: v1
kind: ConfigMap
metadata:
  name: veles-config
  namespace: veles-shield
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  APP_NAME: "Veles Shield"
  APP_VERSION: "1.0.0"
  SLA_MAX_LATENCY_MS: "50.0"
  RATE_LIMIT_GLOBAL_PER_MIN: "120"
  VELOCITY_KYC_LIMIT_PER_MIN: "5"
  VELOCITY_TX_LIMIT_PER_MIN: "10"
  REDIS_ENABLED: "true"
  REDIS_URL: "redis://veles-redis.veles-shield.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql+psycopg2://veles_user:veles_secure_pass_2026@veles-postgres.veles-shield.svc.cluster.local:5432/veles_shield"
---
apiVersion: v1
kind: Secret
metadata:
  name: veles-secrets
  namespace: veles-shield
type: Opaque
stringData:
  SECRET_KEY: "veles-shield-production-secret-key-must-be-rotated-32bytes"
  AEGIS_ENCRYPTION_KEY: "c2VjdXJlLWRwZHBhLWFlZ2lzLXRydXN0LTIwMjYtMDAwMSE="
  VELES_ENCRYPTION_KEY: "c2VjdXJlLWRwZHBhLWFlZ2lzLXRydXN0LTIwMjYtMDAwMSE="
  POSTGRES_USER: "veles_user"
  POSTGRES_PASSWORD: "veles_secure_pass_2026"
  POSTGRES_DB: "veles_shield"
