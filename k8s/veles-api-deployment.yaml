apiVersion: apps/v1
kind: Deployment
metadata:
  name: veles-api
  namespace: veles-shield
  labels:
    app: veles-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: veles-api
  template:
    metadata:
      labels:
        app: veles-api
    spec:
      containers:
        - name: veles-api
          image: veles-shield/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: veles-config
            - secretRef:
                name: veles-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: veles-api
  namespace: veles-shield
spec:
  selector:
    app: veles-api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: veles-api-pdb
  namespace: veles-shield
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: veles-api
