apiVersion: apps/v1
kind: Deployment
metadata:
  name: veles-redis
  namespace: veles-shield
  labels:
    app: veles-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: veles-redis
  template:
    metadata:
      labels:
        app: veles-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: veles-redis
  namespace: veles-shield
spec:
  selector:
    app: veles-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
