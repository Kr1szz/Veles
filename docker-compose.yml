services:
  veles-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: veles-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your deployment environment}
      - AEGIS_ENCRYPTION_KEY=${VELES_ENCRYPTION_KEY:?Set VELES_ENCRYPTION_KEY in your deployment environment}
      - VELES_ENCRYPTION_KEY=${VELES_ENCRYPTION_KEY:?Set VELES_ENCRYPTION_KEY in your deployment environment}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - SLA_MAX_LATENCY_MS=50.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - veles-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  veles-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: veles-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - veles-api
    networks:
      - veles-net

  postgres:
    image: postgres:16-alpine
    container_name: veles-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in your deployment environment}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your deployment environment}
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB in your deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - veles-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veles_user -d veles_shield"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veles-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    networks:
      - veles-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:

networks:
  veles-net:
    driver: bridge
